<!doctype html>
<html lang="en" dir="ltr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f1a" />
    <meta name="description" content="Smart Alarm — offline-first alarm clock with smart wake-up features." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Smart Alarm</title>
    <script>
      // Apply persisted theme + wallpaper scrim before first paint to avoid a flash.
      try {
        var raw = localStorage.getItem('smart-alarm:v1');
        var s = raw ? JSON.parse(raw).state.settings : {};
        var mode = s.theme || 'system';
        var accent = s.accent || 'blue';
        var wp = s.wallpaperId || 'default';
        var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        var scrim =
          wp === 'custom' || (wp !== 'default' && wp !== 'builtin:minimal-light')
            ? 'dark'
            : wp === 'builtin:minimal-light'
              ? 'light'
              : dark
                ? 'dark'
                : 'light';
        var root = document.documentElement;
        root.classList.toggle('dark', dark);
        root.dataset.accent = accent;
        root.dataset.wallpaperScrim = scrim;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
